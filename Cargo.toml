[package]
name = "switchbot-bridge"
version = "0.1.0"
edition = "2021"
description = "A lightweight BLE bridge and CLI for SwitchBot devices (CoreBluetooth on macOS & BlueZ on Linux)"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["switchbot", "bluetooth", "ble", "home-assistant", "iot"]
categories = ["command-line-utilities", "hardware-support"]

[dependencies]
btleplug = "0.11"
tokio = { version = "1.38", features = ["full"] }
clap = { version = "4.5", features = ["derive"] }
axum = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = "1.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
futures = "0.3"
